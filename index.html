<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>زردآلو | با زردآلو خرید راحته!</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #fff;
            color: #222;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           PROFILE SETUP
        ========================= */

        #profileSetup {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff;
        }

        .profile-box {
            width: 100%;
            max-width: 470px;
            background: #fff;
            border: 2px solid #ffd400;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
            text-align: center;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffd400;
            margin: 0 auto 18px;
        }

        .profile-box h1 {
            margin-bottom: 8px;
        }

        .profile-box > p {
            color: #777;
            margin-bottom: 20px;
        }

        .profile-preview {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 4px solid #ffd400;
            background: #fff6a8;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            font-size: 50px;
        }

        .profile-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-options {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .avatar-option {
            border: none;
            background: #fff2a0;
            border-radius: 12px;
            height: 45px;
            font-size: 23px;
        }

        .avatar-option:hover {
            background: #ffd400;
        }

        .image-picker {
            display: block;
            background: #f3f3f3;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 18px;
            cursor: pointer;
        }

        .field {
            margin-bottom: 15px;
            text-align: right;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 13px;
            outline: none;
            background: white;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: #ffd400;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* =========================
           BUTTONS
        ========================= */

        .yellow-button {
            width: 100%;
            border: none;
            border-radius: 13px;
            background: #ffd400;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
        }

        .yellow-button:hover {
            background: #f1c600;
        }

        .red-button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            background: #e53935;
            color: white;
        }

        /* =========================
           APP
        ========================= */

        #app {
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 10px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: bold;
        }

        .brand-logo {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            background: #ffd400;
        }

        .header-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #ffd400;
            background: #fff6a8;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* =========================
           NAV
        ========================= */

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 10px 15px;

            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        nav button {
            border: none;
            background: #f2f2f2;
            padding: 10px 15px;
            border-radius: 12px;
            white-space: nowrap;
        }

        nav button:hover {
            background: #ffd400;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 25px 15px 50px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================
           HOME - OLD STRUCTURE
        ========================= */

        .home-hero {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
            margin-bottom: 22px;
        }

        .home-logo {
            width: 100px;
            height: 100px;
            background: #ffd400;
            border-radius: 50%;
            margin: 0 auto 18px;
        }

        .home-hero h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .home-hero p {
            color: #777;
            font-size: 17px;
        }

        .home-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 15px;
        }

        .home-button {
            min-height: 120px;
            border: none;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 5px 18px rgba(0,0,0,.05);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 9px;
            font-size: 16px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #fff8c9;
            border-color: #ffd400;
        }

        .home-icon {
            font-size: 40px;
        }

        /* =========================
           ACCOUNT
        ========================= */

        .account-card {
            max-width: 650px;
            margin: auto;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
        }

        .account-avatar {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid #ffd400;
            background: #fff6a8;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;
        }

        .account-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-info {
            background: #fafafa;
            border-radius: 15px;
            padding: 18px;
        }

        .account-info p {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .account-info p:last-child {
            border-bottom: none;
        }

        /* =========================
           CARDS
        ========================= */

        .card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
        }

        .page-title {
            margin-bottom: 20px;
        }

        /* =========================
           MARKET
        ========================= */

        .filters {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 10px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .products-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px, 1fr)
                );
            gap: 15px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 17px;
            background: white;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .product-price {
            font-weight: bold;
            margin: 10px 0;
        }

        .gift {
            color: #16852b;
            font-weight: bold;
        }

        .product-card button {
            margin-top: 10px;
        }

        /* =========================
           CART
        ========================= */

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .cart-summary {
            background: #fff8b5;
            border-radius: 16px;
            padding: 18px;
            margin-top: 20px;
            line-height: 2;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message-item {
            padding: 14px;
            border-radius: 12px;
            background: #f4f4f4;
            margin-bottom: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid #eee;
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {

            .avatar-options {
                grid-template-columns:
                    repeat(4, 1fr);
            }

            .home-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .profile-box {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

     PROFILE SETUP
===================================================== -->

<section
    id="profileSetup"
    style="display:flex;"
>

    <div class="profile-box">

        <div
